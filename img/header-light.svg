<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="moli721 · A long way to go">
  <style>
    .px { image-rendering: optimizeSpeed; image-rendering: crisp-edges; image-rendering: pixelated; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sway { animation: sway 48s steps(12) infinite alternate; }
    .tw { animation: tw 3.6s steps(2) infinite; }
    .tw1 { animation-duration: 5.2s; animation-delay: -1.3s; }
    .tw2 { animation-duration: 7.4s; animation-delay: -2.9s; }
    @keyframes sway { from { transform: translateX(-15px); } to { transform: translateX(15px); } }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .sway, .tw { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="860" height="240" rx="14"/></clipPath>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#14203C" flood-opacity=".35"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <image class="px" width="860" height="240" preserveAspectRatio="none" href="data:image/png;base64,"/>
    
    <g class="sway"><image class="px" x="-20" width="900" height="240" preserveAspectRatio="none" href="data:image/png;base64,"/></g>
    <path d="M314.0 0 A9 9 0 0 1 323.0 9 L323.0 17 A15 15 0 0 0 338.0 32 L522.0 32 A15 15 0 0 0 537.0 17 L537.0 9 A9 9 0 0 1 546.0 0 Z" fill="rgb(255 255 255 / 78%)" stroke="rgb(255 255 255 / 60%)" stroke-width="1"/>

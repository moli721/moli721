    <text class="sans" x="430.0" y="127.2" font-size="62" font-weight="700" letter-spacing="-1.5" text-anchor="middle" fill="#FFFFFF" filter="url(#sh)">moli721</text>
    <text class="mono" x="430.0" y="157.2" font-size="11" font-weight="600" letter-spacing="6" text-anchor="middle" fill="#FFFFFF" filter="url(#sh)">A LONG WAY TO GO</text>

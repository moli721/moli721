<svg xmlns="http://www.w3.org/2000/svg" width="860" height="110" viewBox="0 0 860 110" role="img" aria-label="Thanks for stopping by">
  <style>
    .px { image-rendering: optimizeSpeed; image-rendering: crisp-edges; image-rendering: pixelated; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sway { animation: sway 48s steps(12) infinite alternate; }
    .tw { animation: tw 3.6s steps(2) infinite; }
    .tw1 { animation-duration: 5.2s; animation-delay: -1.3s; }
    .tw2 { animation-duration: 7.4s; animation-delay: -2.9s; }
    @keyframes sway { from { transform: translateX(-15px); } to { transform: translateX(15px); } }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .sway, .tw { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="860" height="110" rx="14"/></clipPath>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity=".55"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <image class="px" width="860" height="110" preserveAspectRatio="none" href="data:image/png;base64,"/>
    <g class="tw tw0" fill="#E6EBFF"><rect x="760.0" y="7.5" width="2.5" height="2.5"/><rect x="175.0" y="32.5" width="2.5" height="2.5"/><rect x="177.5" y="42.5" width="2.5" height="2.5"/></g><g class="tw tw1" fill="#E6EBFF"><rect x="307.5" y="50.0" width="2.5" height="2.5"/><rect x="477.5" y="52.5" width="2.5" height="2.5"/><rect x="747.5" y="10.0" width="2.5" height="2.5"/><rect x="605.0" y="25.0" width="2.5" height="2.5"/><rect x="250.0" y="60.0" width="2.5" height="2.5"/><rect x="707.5" y="42.5" width="2.5" height="2.5"/><rect x="197.5" y="22.5" width="2.5" height="2.5"/><rect x="562.5" y="65.0" width="2.5" height="2.5"/><rect x="390.0" y="37.5" width="2.5" height="2.5"/><rect x="497.5" y="50.0" width="2.5" height="2.5"/><rect x="752.5" y="37.5" width="2.5" height="2.5"/></g><g class="tw tw2" fill="#E6EBFF"><rect x="672.5" y="35.0" width="2.5" height="2.5"/><rect x="85.0" y="17.5" width="2.5" height="2.5"/><rect x="42.5" y="70.0" width="2.5" height="2.5"/><rect x="610.0" y="52.5" width="2.5" height="2.5"/><rect x="500.0" y="60.0" width="2.5" height="2.5"/><rect x="550.0" y="35.0" width="2.5" height="2.5"/><rect x="742.5" y="40.0" width="2.5" height="2.5"/><rect x="435.0" y="57.5" width="2.5" height="2.5"/></g>
    <g class="sway"><image class="px" x="-20" width="900" height="110" preserveAspectRatio="none" href="data:image/png;base64,"/></g>
    <text class="sans" x="430.0" y="46.199999999999996" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF9" filter="url(#sh)">Thanks for stopping by</text>
    <text class="mono" x="430.0" y="68.19999999999999" font-size="10" font-weight="600" letter-spacing="5" text-anchor="middle" fill="#AEB8D6" filter="url(#sh)">SEE YOU AROUND</text>
  </g>
</svg>

# GitHub 个人主页数据图自动生成
#
# 生成文件：
# - github-metrics/base.svg            基础指标（概览、活动、社区、仓库）
# - github-metrics/languages.svg       最常用语言
# - github-metrics/isocalendar.svg     全年 3D 贡献日历
#
# 三张图都先渲染到 Runner 上（output_action: none），最后只提交一次；
# 图片没变化时不提交。
#
# 依赖：
# - https://github.com/lowlighter/metrics

name: GitHub Metrics

on:
  # cron 用 UTC；00:00 UTC = 北京时间 08:00。每天一次足够，不必每小时。
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    # 自动生成的图片提交不再触发本工作流，避免重复运行。
    paths-ignore:
      - "github-metrics/**"

# 定时、手动、push 同时触发时只保留最新一次，避免并发写 main。
concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # 固定到 v3.34 的提交，避免 @latest 无提示改变行为。升级前先手动验证再改 SHA。
      - name: Base metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: moli721
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"
          plugin_introduction: yes
          plugin_traffic: no
          # 插件出错时直接失败，避免提交残缺的 SVG。
          plugins_errors_fatal: yes
          output_action: none

      - name: Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: moli721
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugins_errors_fatal: yes
          output_action: none

      - name: Full-year contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: moli721
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          output_action: none

      - name: Commit all metrics at once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p github-metrics
          for f in base languages isocalendar; do
            src="/metrics_renders/github-metrics/$f.svg"
            # 防止空文件或错误页覆盖已有图片
            test -s "$src"
            grep -q '<svg' "$src"
            cp "$src" "github-metrics/$f.svg"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics
          if git diff --cached --quiet; then
            echo "Metrics have no changes."
            exit 0
          fi
          git commit -m "chore: update GitHub metrics [skip ci]"
          git pull --rebase origin main
          git push origin main
